name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main
  # Permite rodar manualmente pela aba Actions no GitHub
  workflow_dispatch:

# Permissões necessárias para o deploy via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que só um deploy rode por vez; cancela o anterior se houver
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Enviar artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Pasta gerada pelo Vite
          path: ./dist

  deploy:
    name: Deploy para GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    # Ambiente oficial do GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
